name: Publish distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: Select TestPyPI for rehearsal; run this workflow on a version tag
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.index || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      expected-tag: ${{ github.event.release.tag_name || github.ref_name }}

  # The privileged upload lives in this top-level workflow, not the reusable build.
  # Configure this filename and the matching environment as the Trusted Publisher.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.index || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Upload to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - name: Upload to PyPI
        if: github.event_name == 'release' || inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
