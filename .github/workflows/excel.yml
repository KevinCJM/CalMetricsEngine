name: Excel formula conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libreoffice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc
      - run: python -m pip install '.[excel,test]' 'openpyxl>=3.1,<4'
      - run: python -m pytest tests/test_excel_export.py tests/test_excel_parity_tool.py -q
      # This is a separate engine lane, never evidence of Microsoft Excel acceptance.
      - run: python tools/check_excel_parity.py --engine libreoffice --all-cases --check-edits --output excel-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libreoffice-formula-evidence
          path: excel-evidence/
